<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#1c1b1b",

                    "on-primary": "#003543",
                    "error": "#ffb4ab",
                    "surface-tint": "#4cd6ff",
                    "tertiary": "#dfdcdb",
                    "primary-fixed": "#b7eaff",
                    "on-background": "#e5e2e1",
                    "primary": "#a4e6ff",
                    "surface-container-lowest": "#0e0e0e",
                    "surface-container-highest": "#353534",
                    "surface-dim": "#131313",
                    "on-primary-fixed-variant": "#004e60",
                    "on-secondary": "#460283",
                    "primary-container": "#00d1ff",
                    "inverse-surface": "#e5e2e1",
                    "outline": "#859399",
                    "tertiary-fixed-dim": "#c9c6c5",
                    "on-tertiary-fixed-variant": "#474646",
                    "on-secondary-container": "#cfa7ff",
                    "on-secondary-fixed": "#2a0053",
                    "tertiary-fixed": "#e5e2e1",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed-dim": "#dab9ff",
                    "surface-variant": "#353534",
                    "on-surface-variant": "#bbc9cf",

            "fontFamily": {

                    "body-md": ["Atkinson Hyperlegible Next"]
            },
            "fontSize": {

                    "body-lg": ["20px", {"lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "display-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "0.02em", "fontWeight": "700"}],
                    "label-caps": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "600"}],
                    "body-md": ["18px", {"lineHeight": "1.5", "letterSpacing": "0.01em", "fontWeight": "400"}]

          },
        },
      }

<style>
        .glass-panel {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 2px 2px 20px rgba(255, 255, 255, 0.02);
        }
        .light-leak {
            background: linear-gradient(135deg, rgba(164, 230, 255, 0.05) 0%, rgba(255, 255, 255, 0) 50%);
        }
        .route-line {
            filter: drop-shadow(0 0 8px rgba(76, 214, 255, 0.6));
        }
        .hud-scanline {
            background: linear-gradient(to bottom, transparent 50%, rgba(164, 230, 255, 0.02) 50%);
            background-size: 100% 4px;
        }
        .glow-orb {
            box-shadow: 0 0 20px rgba(164, 230, 255, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md overflow-hidden selection:bg-primary/30">
<!-- Top Navigation Shell -->
<nav class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-[0_0_20px_rgba(76,214,255,0.1)] rounded-b-lg">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-headline-md" data-icon="spatial_audio">spatial_audio</span>
<span class="text-headline-md font-display-lg font-bold text-primary tracking-tighter">HearSight</span>
</div>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-white/5 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="emergency">emergency</span>
</button>
</div>
</nav>
<!-- Main Tactical HUD Canvas -->
<main class="relative w-full h-screen bg-black overflow-hidden flex flex-col items-center justify-center">
<!-- Abstract Tactical Map View -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute inset-0 hud-scanline"></div>
<!-- Map Grid -->
<div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, rgba(164,230,255,0.05) 1px, transparent 0); background-size: 40px 40px;"></div>
<!-- Tactical Visuals / Map Placeholder -->
<img class="w-full h-full object-cover grayscale opacity-30" data-alt="A top-down tactical satellite map view of a complex urban cityscape at night. The image is rendered in high-contrast deep blacks and electric blue outlines, emphasizing architectural forms and street grids. The visual style is inspired by minimalist sci-fi head-up displays with a cinematic, technical atmosphere and soft atmospheric glow along the thoroughfares." data-location="London" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI9upzJgQBxJybWH843nCMhXc_DSMjD5czSYjpZTCrin7408uNl4tt7lhTFpWfQCTNEH0ZtT0pFDLWlKtTL-56D78m1lmdt-hbDF5LqC4E-143gM88KDaDjrZXZb9iG_3h2cisE6BkFKj5ABXdi2I5uEnJyT_U3vTp8LI66tKZq4o-RDXqlqlgOtjUnU49JXRn12YzJlakpHIyFP-HhmgyrPh3yn-Ab4lq42Rt_FFWxUtcPYqylLMFxR3b1_hJvGuR9I2E1iIowoaI"/>
</div>
<!-- Central HUD Route -->
<div class="relative z-10 w-full max-w-4xl px-margin-mobile flex flex-col items-center">
<!-- Route Visual Element -->
<div class="relative w-full h-96 mb-12 flex items-center justify-center">
<!-- Glowing Path -->
<svg class="w-full h-full route-line" fill="none" viewbox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<path d="M100 350C150 350 200 50 350 50C500 50 550 300 700 300" stroke="#a4e6ff" stroke-dasharray="12 12" stroke-linecap="round" stroke-width="4"></path>
<!-- Waypoints -->
<circle class="glow-orb" cx="100" cy="350" fill="#a4e6ff" r="8"></circle>
<circle cx="350" cy="50" fill="#a4e6ff" r="6"></circle>
<circle class="glow-orb" cx="700" cy="300" fill="#a4e6ff" r="10"></circle>
</svg>
<!-- Landmark Overlay Cards (Asymmetric Layout) -->
<div class="absolute top-0 left-1/4 -translate-x-1/2 glass-panel p-6 rounded-lg max-w-[240px] light-leak">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="park">park</span>
<span class="font-label-caps text-label-caps text-primary">LANDMARK</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Victoria Park</h3>
<p class="text-on-surface-variant text-body-md">Dense foliage on left. Clear walking path ahead.</p>
</div>
<div class="absolute bottom-10 right-1/4 translate-x-1/2 glass-panel p-6 rounded-lg max-w-[240px] light-leak">
<div class="flex items-center gap-3 mb-2">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="coffee">coffee</span>
<span class="font-label-caps text-label-caps text-primary">INTERSECTION</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Station Road</h3>
<p class="text-on-surface-variant text-body-md">Busy traffic detected. AI audio cues active.</p>
</div>
</div>
<!-- Distance & Time HUD -->
<div class="flex gap-12 mb-24">
<div class="text-center">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-2">DISTANCE</span>
<span class="block font-display-xl text-display-xl text-primary">1.2<span class="text-headline-md font-normal text-on-surface-variant ml-1">KM</span></span>
</div>
<div class="w-[1px] h-20 bg-white/10"></div>
<div class="text-center">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-2">DURATION</span>
<span class="block font-display-xl text-display-xl text-primary">14<span class="text-headline-md font-normal text-on-surface-variant ml-1">MIN</span></span>
</div>
<div class="w-[1px] h-20 bg-white/10"></div>
<div class="text-center">
<span class="block font-label-caps text-label-caps text-on-surface-variant mb-2">STEPS</span>
<span class="block font-display-xl text-display-xl text-primary">1,840</span>
</div>
</div>
</div>
<!-- Massive Bottom Button Area -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile z-40 bg-gradient-to-t from-black via-black/80 to-transparent pt-32">
<button class="group relative w-full bg-primary text-on-primary font-display-lg text-display-lg py-8 rounded-xl shadow-[0_0_40px_rgba(164,230,255,0.3)] hover:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-6 overflow-hidden">
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
<span class="relative material-symbols-outlined text-[48px]" data-icon="navigation" data-weight="fill">navigation</span>
<span class="relative tracking-tighter">Start Navigation</span>
</button>
<div class="mt-8 flex justify-center gap-8">
<div class="flex items-center gap-2 text-on-surface-variant font-label-caps text-label-caps">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                    SPATIAL AUDIO CALIBRATED
                </div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-caps text-label-caps">
<span class="w-2 h-2 rounded-full bg-primary"></span>
                    AI VISION ACTIVE
                </div>
</div>
</div>
</main>
<!-- Side Drawer Toggle (Simplified for Preview) -->
<button class="fixed top-1/2 left-4 -translate-y-1/2 z-50 glass-panel p-3 rounded-full text-primary hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Bottom Navigation Bar (Contextual) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-8 pointer-events-none">
<div class="flex items-center justify-between w-full max-w-md bg-surface-container/60 dark:bg-surface-container/60 backdrop-blur-2xl rounded-xl border border-white/5 shadow-[0_8px_32px_0_rgba(0,0,0,0.8)] p-2 pointer-events-auto">
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
</button>
<button class="flex items-center justify-center bg-primary text-on-primary rounded-full w-16 h-16 shadow-[0_0_15px_rgba(164,230,255,0.5)] active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</nav>
<!-- Decorative Atmospheric Glows -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[5]">
<div class="absolute -top-[20%] -left-[10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"></div>
</div>
</body></html>
