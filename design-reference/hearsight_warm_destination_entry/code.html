<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
<h1 class="font-display-lg text-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight">HearSight</h1>
<div class="flex items-center">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary hover:bg-primary-container/20 transition-colors Active: scale-95 duration-200">

</button>
</div>
</header>
<main class="flex-grow pt-[72px] pb-[100px] flex flex-col items-center justify-center px-margin-mobile gap-12 max-w-2xl mx-auto w-full">
<!-- Large Central Input Field -->
<section class="w-full space-y-6">
<div class="relative group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary-container/20 to-tertiary-container/20 rounded-[32px] blur opacity-25 group-focus-within:opacity-100 transition duration-1000 group-focus-within:duration-200"></div>
<div class="relative flex items-center bg-surface-container-low rounded-[24px] px-8 py-10 shadow-sm border border-outline-variant/10">
<input autofocus="" class="w-full bg-transparent border-none focus:ring-0 font-display-lg text-headline-lg text-on-surface placeholder:text-on-surface-variant/40 font-bold" placeholder="Where to?" type="text"/>
<span class="material-symbols-outlined text-primary text-4xl" data-icon="near_me">near_me</span>
</div>
</div>
</section>
<!-- Recent Destinations -->
<section class="w-full flex flex-wrap justify-center gap-6">
<button class="flex items-center gap-4 px-8 py-6 bg-surface rounded-[24px] shadow-[0_8px_32px_rgba(144,77,0,0.06)] hover:bg-surface-container-high transition-all active:scale-95 light-leak min-w-[180px]">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<span class="font-label-xl text-label-xl text-on-surface">Home</span>
</button>
<button class="flex items-center gap-4 px-8 py-6 bg-surface rounded-[24px] shadow-[0_8px_32px_rgba(144,77,0,0.06)] hover:bg-surface-container-high transition-all active:scale-95 light-leak min-w-[180px]">

<span class="material-symbols-outlined text-primary" data-icon="work" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
<span class="font-label-xl text-label-xl text-on-surface">Office</span>
