<!DOCTYPE html>

<html class="dark" lang="en"><head>

                        "surface-container": "#211f24",
                        "on-error": "#690005",
                        "on-tertiary": "#3e2e00",
                        "outline": "#948e9c",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-fixed": "#e9ddff",
                        "primary-fixed": "#e9ddff",
                        "surface-container-high": "#2b292f",

                    "borderRadius": {

                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {

                        "gutter": "24px",
                        "touch-target-min": "64px",

                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Space Grotesk"],

                    "fontSize": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .emergency-glow {
            box-shadow: 0 0 60px 10px rgba(147, 0, 10, 0.4);
        }
        .safe-area-inset {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen selection:bg-error selection:text-on-error overflow-hidden">
<!-- Top Navigation Anchor -->
<header class="bg-surface/10 dark:bg-surface/10 backdrop-blur-xl font-headline-lg text-headline-lg-mobile md:text-headline-lg docked full-width top-0 bg-gradient-to-b from-primary/5 to-transparent shadow-[0_-1px_0_rgba(255,255,255,0.1)_inset] fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-margin-mobile py-6 w-full">
<button aria-label="Menu" class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">menu</span>
</button>
<h1 class="font-display-xl text-headline-lg text-primary tracking-tighter">HearSight</h1>
<button aria-label="Safety Home" class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">emergency_home</span>
</button>
</div>
</header>
<!-- Main Content Canvas: Emergency Overlay -->
<main class="relative h-screen w-full flex flex-col items-center justify-center p-margin-mobile bg-radial-gradient from-error-container/20 to-transparent">
<!-- Background HUD element -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] border-[1px] border-error rounded-full opacity-30"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border-[2px] border-error/50 rounded-full opacity-20"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border-[4px] border-error/80 rounded-full opacity-10"></div>
</div>
<!-- Content Stack -->
<div class="relative z-10 w-full max-w-lg flex flex-col items-center gap-stack-gap">
<!-- High-Visibility Status -->
<div class="text-center space-y-4">
<div class="inline-flex items-center gap-2 bg-error-container text-on-error-container px-6 py-2 rounded-full border border-error/50">
<span class="material-symbols-outlined animate-pulse" style="font-variation-settings: 'FILL' 1;">emergency</span>
<span class="font-label-lg uppercase tracking-widest">System Alert</span>
</div>
<h2 class="font-display-xl text-headline-lg md:text-display-xl text-on-surface leading-tight">HELP IS ONE<br/>TOUCH AWAY</h2>
</div>
<!-- Asymmetric Interaction Layout -->
<div class="w-full flex flex-col gap-10 items-center justify-center">
<!-- Primary Action: Call Emergency -->
<button class="group relative flex flex-col items-center justify-center transition-all duration-300 active:scale-95">
<div class="w-48 h-48 md:w-56 md:h-56 rounded-full bg-error border-8 border-error-container flex items-center justify-center emergency-glow group-hover:shadow-[0_0_80px_20px_rgba(147,0,10,0.6)] transition-all">
<span class="material-symbols-outlined text-[64px] text-on-error" style="font-variation-settings: 'FILL' 1;">call</span>
</div>
<div class="mt-6 text-center">
<span class="block font-headline-lg text-error uppercase tracking-tighter">CALL EMERGENCY</span>
<span class="text-on-surface-variant font-label-lg">Connect to 911 immediately</span>
</div>
</button>
<!-- Secondary Actions Hub -->
<div class="flex gap-12 items-start justify-center w-full">
<!-- Share Location -->
<button class="group flex flex-col items-center gap-4 transition-all duration-300 active:scale-90">
<div class="w-touch-target-min h-touch-target-min rounded-full bg-surface-container-high border-2 border-primary flex items-center justify-center shadow-[0_0_30px_rgba(207,188,255,0.2)] group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-[32px] text-primary group-hover:text-on-primary-container">location_on</span>
</div>
<span class="font-label-lg text-on-surface uppercase w-24 text-center leading-none">Share Location</span>
</button>
<!-- Contact Guardian -->
<button class="group flex flex-col items-center gap-4 transition-all duration-300 active:scale-90">
<div class="w-touch-target-min h-touch-target-min rounded-full bg-surface-container-high border-2 border-secondary flex items-center justify-center shadow-[0_0_30px_rgba(205,192,233,0.2)] group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-on-secondary-container">shield_with_heart</span>
</div>
<span class="font-label-lg text-on-surface uppercase w-24 text-center leading-none">Guardian Alert</span>
</button>
<!-- Voice Command -->
<button class="group flex flex-col items-center gap-4 transition-all duration-300 active:scale-90">
<div class="w-touch-target-min h-touch-target-min rounded-full bg-surface-container-high border-2 border-tertiary flex items-center justify-center shadow-[0_0_30px_rgba(231,195,101,0.2)] group-hover:bg-tertiary-container transition-colors">
<span class="material-symbols-outlined text-[32px] text-tertiary group-hover:text-on-tertiary-container">mic</span>
</div>
<span class="font-label-lg text-on-surface uppercase w-24 text-center leading-none">Voice Mode</span>
</button>
</div>
</div>
<!-- Contextual Information Card: Bento Style Minimal -->
<div class="w-full mt-8 bg-surface-container-lowest/40 backdrop-blur-3xl rounded-[32px] p-8 border border-white/5 flex flex-col gap-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">my_location</span>
</div>
<div>
<p class="text-on-surface-variant font-label-lg leading-none mb-1">Your Current Location</p>
<p class="text-on-surface font-body-md font-bold">45.52306, -122.67648</p>
</div>
</div>
<div class="bg-surface-bright px-4 py-2 rounded-lg">
<span class="text-tertiary font-label-lg">Accuracy: 3m</span>
</div>
</div>
<div class="h-40 w-full rounded-2xl overflow-hidden grayscale opacity-50 contrast-125 border border-white/10">
<img class="w-full h-full object-cover" data-alt="A cinematic, high-contrast satellite view map of a dense urban intersection at night. The image is stylized with a deep monochromatic blue and grey filter, featuring vibrant neon red digital waypoint overlays and pathfinding lines. The lighting is low-key with glowing technological UI elements, consistent with a futuristic AI navigation interface aesthetic." data-location="Portland" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCG6hHXyALRlad6hb6Znrhb8Vp4-GoGBUuPh4DGrLYaCXLXSJVAXJwTQ_AXzeOq_NIxQ86veSUtBTjzN6kL1deDtBnj5coC4meA4abgVpQwEzN354cFUv7n7fCR2lmDKp-V50rWtsX3kNCOmWWmhraTaKpZAw5CgKZBxJGZhYgHBnKizx2uC8hYWPnWA72YAj5fNj3_tKWNtBAGS1rShO-S2sVJxFVcZ9wy4f1Pcc7Cq2MUvpoyjUb5zA_rs6oPoVzR62r6IaPrc6f3"/>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<!-- Prohibited on emergency screen but shown for structural reference per instructions if top-level -->
<!-- Determined as active on 'Safety Settings' via nav drawer mapping -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter py-4 bg-surface-container-lowest/80 dark:bg-surface-container-lowest/80 backdrop-blur-3xl rounded-t-[40px] pb-8 bg-gradient-to-t from-primary/10 via-transparent to-transparent shadow-[0_-20px_50px_-12px_rgba(207,188,255,0.2)] md:hidden">
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-[28px]">explore</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-[28px]">spatial_audio</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-[28px]">mic</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-[28px]">history</span>
</button>
<!-- Settings/Safety active state -->
<button class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-touch-target-min h-touch-target-min shadow-[0_0_20px_rgba(207,188,255,0.4)] hover:bg-surface-bright/20 active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined text-[28px]">settings</span>
</button>
</nav>
<!-- Visual Confirmation of Safety Status -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 flex items-center gap-3 px-6 py-4 bg-surface-container-high border border-white/5 rounded-full backdrop-blur-xl z-40">
<div class="w-3 h-3 rounded-full bg-error animate-ping"></div>
<span class="text-on-surface font-label-lg tracking-widest uppercase">Safety Monitoring Active</span>
</div>
</body></html>
