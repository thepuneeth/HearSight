<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: inset 1px 1px 0px 0px rgba(255, 255, 255, 0.8);
        }
        .amber-glow {
            box-shadow: 0 8px 32px rgba(144, 77, 0, 0.12);
        }
        .orb-pulse-1 {
            background: radial-gradient(circle, #ff8c00 0%, #904d00 100%);

    body {

<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center w-full px-margin-mobile h-[72px] bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-[0_4px_20px_rgba(144,77,0,0.08)]">
<div class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-primary-container/20 transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</div>
<h1 class="font-display-lg text-headline-lg text-primary tracking-tight">HearSight</h1>
<div class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-primary-container/20 transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Canvas Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-[72px] pb-[120px] relative overflow-hidden">
<!-- Subtle Audio Waves / Background Decoration -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
<div class="w-[600px] h-[600px] orb-pulse-bg rounded-full opacity-40 blur-3xl"></div>
<div class="absolute w-[400px] h-[400px] border border-primary-container/10 rounded-full scale-110 opacity-20"></div>
<div class="absolute w-[300px] h-[300px] border border-primary-container/20 rounded-full scale-125 opacity-10"></div>
</div>
<!-- Listening Interaction Zone -->
<div class="z-10 flex flex-col items-center space-y-12 max-w-md w-full">
<!-- Massive Central Microphone Orb -->
<div class="relative group">
<!-- Expanding Outer Rings (Visual Pulse) -->
<div class="absolute inset-0 rounded-full bg-primary-container/20 animate-ping opacity-30"></div>
<!-- Main Orb Component -->
<div class="w-[180px] h-[180px] md:w-[240px] md:h-[240px] rounded-full orb-pulse-1 flex items-center justify-center amber-glow light-leak relative z-20 transition-transform duration-700 hover:scale-105">
<span class="material-symbols-outlined text-on-primary text-[64px] md:text-[96px]" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Listening Message -->
<div class="text-center space-y-4">
<h2 class="font-headline-lg text-headline-lg text-inverse-surface tracking-tight">
                    Listening for your command...
                </h2>
<div class="flex items-center justify-center gap-2">
<div class="w-3 h-3 bg-primary-container rounded-full animate-bounce delay-75"></div>
<div class="w-3 h-3 bg-primary-container rounded-full animate-bounce delay-150"></div>
<div class="w-3 h-3 bg-primary-container rounded-full animate-bounce delay-300"></div>
</div>
</div>
<!-- Descriptive Insight Card (Bento-style snippet) -->
<div class="w-full bg-surface-container-low/60 backdrop-blur-md rounded-[24px] p-6 light-leak amber-glow flex items-center gap-6">
<div class="bg-primary-container/10 p-4 rounded-full">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lightbulb">lightbulb</span>
</div>
<div class="flex-1">
<p class="font-label-xl text-label-xl text-on-surface-variant">Try asking:</p>
<p class="font-body-lg text-body-lg text-on-surface italic">"Describe what's in front of me"</p>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Suppressed for Focused Intent - Using Contextual Cancel Button instead -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile flex justify-center z-50 bg-gradient-to-t from-background via-background/90 to-transparent">
<button class="w-full max-w-md h-touch-target-min bg-surface-container-highest text-inverse-surface font-label-xl text-label-xl rounded-full shadow-lg border border-outline-variant/30 flex items-center justify-center gap-3 active:scale-95 transition-all duration-200 hover:bg-surface-dim">
<span class="material-symbols-outlined" data-icon="close">close</span>
            Cancel
        </button>
</div>
