<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                    "tertiary": "#e7c365",
                    "surface-container": "#211f24",
                    "on-error": "#690005",
                    "on-tertiary": "#3e2e00",
                    "outline": "#948e9c",
                    "on-tertiary-fixed-variant": "#594400",
                    "secondary-fixed": "#e9ddff",
                    "primary-fixed": "#e9ddff",
                    "surface-container-high": "#2b292f",
                    "tertiary-container": "#c9a74d",
                    "on-surface-variant": "#cbc4d2",
                    "outline-variant": "#494551",
                    "surface-variant": "#36343a",
                    "primary-fixed-dim": "#cfbcff",
                    "secondary": "#cdc0e9",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#22005d",

                    "xl": "0.75rem",

            "spacing": {

                    "gutter": "24px",
                    "touch-target-min": "64px",
                    "margin-mobile": "20px",
                    "margin-desktop": "48px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Space Grotesk"],
                    "display-xl": ["Space Grotesk"],

                    "body-md": ["Space Grotesk"],

                    "headline-lg": ["Space Grotesk"]
            },
            "fontSize": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        .audio-pulse {
            border: 2px solid rgba(207, 188, 255, 0.3);
            border-radius: 50%;
            position: absolute;
        }
        .haptic-wave {
            background: radial-gradient(circle, rgba(207,188,255,0.1) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface font-body-md overflow-hidden select-none">
<!-- Top Navigation Anchor (Shared Component: TopAppBar) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-6 bg-surface/10 backdrop-blur-xl bg-gradient-to-b from-primary/5 to-transparent shadow-[0_-1px_0_rgba(255,255,255,0.1)_inset]">
<div class="flex items-center gap-4">
<button class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">menu</span>
</button>
<h1 class="font-display-xl text-headline-lg text-primary tracking-tighter">HearSight</h1>
</div>
<button class="text-primary hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[32px]">emergency_home</span>
</button>
</header>
<!-- Main Navigation Canvas -->
<main class="relative h-screen w-full flex flex-col items-center justify-center p-margin-mobile">
<!-- Haptic Feedback Backdrop (The "Vibrating" Atmosphere) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="haptic-wave absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] aspect-square opacity-30"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(103,80,164,0.15)_0%,transparent_70%)]"></div>
</div>
<!-- Audio Radar HUD -->
<div class="relative w-full max-w-lg aspect-square flex items-center justify-center">
<!-- Concentric Depth Rings -->
<div class="audio-pulse w-full h-full border-primary/20"></div>
<div class="audio-pulse w-[75%] h-[75%] border-primary/40"></div>
<div class="audio-pulse w-[50%] h-[50%] border-primary/60"></div>
<div class="audio-pulse w-[25%] h-[25%] border-primary/80"></div>
<!-- Directional Glow Indicator -->
<div class="absolute top-0 w-8 h-32 bg-gradient-to-t from-transparent via-primary to-primary rounded-full blur-md opacity-80" style="transform: rotate(45deg) translateY(-20%);"></div>
<!-- Central Node (User) -->
<div class="relative z-10 w-12 h-12 bg-primary rounded-full shadow-[0_0_40px_rgba(207,188,255,0.8)] flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
<!-- Spatial Object Pins (Detected entities) -->
<div class="absolute top-[15%] right-[25%] flex flex-col items-center gap-2">
<div class="w-4 h-4 bg-tertiary rounded-full shadow-[0_0_20px_rgba(231,195,101,0.6)]"></div>
<span class="font-label-lg text-tertiary-fixed-dim text-xs uppercase tracking-widest">Doorway</span>
</div>
<div class="absolute bottom-[30%] left-[10%] flex flex-col items-center gap-2">
<div class="w-6 h-6 border-2 border-error rounded-full animate-pulse shadow-[0_0_20px_rgba(255,180,171,0.4)]"></div>
<span class="font-label-lg text-error text-xs uppercase tracking-widest">Obstacle</span>
</div>
</div>
<!-- High-Contrast Instruction HUD -->
<div class="mt-stack-gap text-center z-20">
<p class="font-label-lg text-primary uppercase tracking-[0.3em] mb-2 opacity-70">Next Action</p>
<h2 class="font-display-xl text-[42px] md:text-[64px] leading-tight text-on-surface font-bold tracking-tight">
                TURN <span class="text-primary shadow-primary/20 drop-shadow-[0_0_15px_rgba(207,188,255,0.5)]">RIGHT</span><br/>
                IN 20 FT
            </h2>
</div>
<!-- Ambient Metadata -->
<div class="absolute bottom-32 w-full flex justify-between px-margin-mobile">
<div class="flex flex-col">
<span class="font-label-lg text-on-surface-variant text-sm uppercase">Pace</span>
<span class="font-body-xl text-primary">3.2 mph</span>
</div>
<div class="flex flex-col text-right">
<span class="font-label-lg text-on-surface-variant text-sm uppercase">ETA</span>
<span class="font-body-xl text-primary">4 mins</span>
</div>
</div>
</main>
<!-- Navigation Shell (Shared Component: BottomNavBar) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter py-4 bg-surface-container-lowest/80 backdrop-blur-3xl bg-gradient-to-t from-primary/10 via-transparent to-transparent shadow-[0_-20px_50px_-12px_rgba(207,188,255,0.2)] rounded-t-[40px] pb-8">
<a class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="explore">explore</span>
</a>
<a class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-touch-target-min h-touch-target-min shadow-[0_0_20px_rgba(207,188,255,0.4)] transition-all active:scale-90 duration-300 ease-out" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="spatial_audio" style="font-variation-settings: 'FILL' 1;">spatial_audio</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="mic">mic</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="history">history</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="settings">settings</span>
</a>
</nav>
<!-- Side Navigation (Shared Component: NavigationDrawer) - Hidden by default, accessible via menu -->
<aside class="fixed left-0 top-0 h-full w-[320px] bg-surface-container-low rounded-r-xl shadow-2xl z-[60] transform -translate-x-full transition-transform duration-500 ease-in-out">
<div class="flex flex-col gap-stack-gap p-margin-mobile">
<div class="flex items-center gap-4 mb-8">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img alt="Navigator" class="w-full h-full object-cover" data-alt="A professional headshot of a futuristic technology assistant with subtle glowing interfaces on their skin. The background is a dark, sleek laboratory with soft violet and cyan lighting. The aesthetic is clean, cinematic, and evokes a sense of advanced artificial intelligence and human partnership." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwNI1OnN69HC9RKbMa_tFff2ZQpcxubElHyiYpsOWVLg7Y1WLJY2Y-sLCbEafkseGWLbU4HEmPBrfzIG60gr5pua2cN4ZsSLppTpFqMv7BJMiQQ4ytYngED3fmpBf4kK8jTNd73NMj_38_2ipoOc7JJ6vUBSjOR2JXhWTo-KDUhY_jyjvmV0kWp56eKdOnibngl-6fuSyfsQeu5avCJmb0uH1jF1aiW54jO3pJvWkEoLiw1agv7iUScJ6QDXaPSzj4M8Zj7zvWHnlj"/>
</div>
<div>
<h3 class="font-headline-lg text-primary">Navigator</h3>
<p class="font-label-lg text-on-surface-variant">System Active</p>
</div>
</div>
<nav class="flex flex-col gap-4">
<a class="flex items-center gap-4 p-4 text-on-surface-variant hover:bg-surface-container-high rounded-xl font-body-xl" href="#">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
                    Vision Assistant
                </a>
<a class="flex items-center gap-4 p-4 bg-secondary-container text-on-secondary-container rounded-xl font-bold font-body-xl" href="#">
<span class="material-symbols-outlined" data-icon="radar">radar</span>
                    Navigation HUD
                </a>
<a class="flex items-center gap-4 p-4 text-on-surface-variant hover:bg-surface-container-high rounded-xl font-body-xl" href="#">
<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
                    Audio Library
                </a>
<a class="flex items-center gap-4 p-4 text-on-surface-variant hover:bg-surface-container-high rounded-xl font-body-xl" href="#">
<span class="material-symbols-outlined" data-icon="security">security</span>
                    Safety Settings
                </a>
</nav>
</div>
</aside>
</body></html>
