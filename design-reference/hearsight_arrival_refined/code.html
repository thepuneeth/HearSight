<body class="bg-background text-on-background font-body-md selection:bg-tertiary/30 min-h-screen flex flex-col overflow-hidden">
<!-- Shell: TopAppBar (Suppressed for transactional arrival screen per UX goals) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile py-6 bg-gradient-to-b from-primary/5 to-transparent">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-display-xl text-headline-lg text-primary tracking-tighter">HearSight</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary hover:scale-105 transition-transform">emergency_home</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative px-margin-mobile">
<!-- Atmospheric Background Glow -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="glow-core w-[120%] h-[80%] rounded-full opacity-60"></div>
</div>
<!-- Arrival Typography -->
<div class="relative z-10 text-center flex flex-col items-center gap-stack-gap">
<div class="w-24 h-24 rounded-full border-2 border-tertiary/20 flex items-center justify-center bg-tertiary/5 backdrop-blur-md mb-4 shadow-[0_0_50px_rgba(231,195,101,0.15)]">
<span class="material-symbols-outlined text-[48px] text-tertiary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="space-y-4">
<h2 class="font-display-xl text-headline-lg text-on-surface tracking-tighter leading-tight text-glow">
          YOU HAVE<br/>ARRIVED
        </h2>
<p class="font-body-xl text-on-surface-variant max-w-[280px] mx-auto opacity-80">
          Your destination is directly ahead.
        </p>
</div>
</div>
<!-- Contextual Action: Save Location -->
<div class="mt-20 w-full max-w-sm px-margin-mobile z-20">
<button class="w-full h-touch-target-min bg-surface-bright/10 backdrop-blur-xl border border-white/10 rounded-full flex items-center justify-center gap-3 text-tertiary font-label-lg shadow-2xl hover:bg-surface-bright/20 transition-all active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bookmark</span>
        Save Location
      </button>
<div class="mt-stack-gap flex flex-col gap-4">
<div class="flex items-center gap-4 p-4 rounded-xl bg-surface-container-low/40 backdrop-blur-md border border-outline-variant/20">
<div class="w-12 h-12 rounded-lg bg-tertiary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">history</span>
</div>
<div>
<p class="font-label-lg text-on-surface">Central Park North</p>
<p class="text-on-surface-variant text-sm">Arrived 14:02 PM</p>
</div>
</div>
</div>
</div>
<!-- Visual Anchor: Map Preview (Subtle Glassmorphism) -->
<div class="absolute bottom-40 left-0 right-0 h-32 flex justify-center opacity-40 pointer-events-none">
<div class="w-full max-w-md h-full rounded-3xl overflow-hidden grayscale contrast-150">
<img class="w-full h-full object-cover" data-alt="A stylized minimalist topographic map showing abstract city blocks rendered in deep charcoal and warm amber lines. The map has a cinematic HUD aesthetic with faint grid overlays and a soft golden glow at the center marking a destination. The lighting is moody and reassuring. High-end digital interface design with glassmorphic blur effects." data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuLbSsNitOjo3gb82iVUihVmBWdqszB1tA8hJfuZP9FGKA6R6a6ZczhEzeyFvT8IlEuo_i_kvK6SiIuaWkgx4XAXRANItFlAItnyeWhgF5zkPRU10ZYxilVc6JVvC6uQHY0AEk0rloalcOweTeCPZwip1JSkEU9BForIH4SebmtJhBOE825tQhYvI9ygJhOLCX0DtH2f8MUVkEduSu2LNPt3-IDmN62KhngX6PCXMFd4FN2RUDRtH3N8dA7X0RI_en8cGIjGSEUvsV"/>
</div>
</div>
</main>
<!-- Shell: BottomNavBar (Active: History/Arrival) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-gutter py-4 bg-surface-container-lowest/80 dark:bg-surface-container-lowest/80 backdrop-blur-3xl rounded-t-[40px] pb-8 bg-gradient-to-t from-primary/10 via-transparent to-transparent shadow-[0_-20px_50px_-12px_rgba(207,188,255,0.2)]">
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 transition-all">
<span class="material-symbols-outlined">explore</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 transition-all">
<span class="material-symbols-outlined">spatial_audio</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 transition-all">
<span class="material-symbols-outlined">mic</span>
</button>
<button class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-touch-target-min h-touch-target-min shadow-[0_0_20px_rgba(207,188,255,0.4)] active:scale-90 duration-300 ease-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-touch-target-min h-touch-target-min hover:bg-surface-bright/20 transition-all">
<span class="material-symbols-outlined">settings</span>
</button>
