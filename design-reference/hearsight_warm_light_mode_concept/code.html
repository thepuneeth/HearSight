<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/10 backdrop-blur-xl flex justify-between items-center px-margin-mobile py-6 bg-gradient-to-b from-primary/5 to-transparent shadow-[0_-1px_0_rgba(255,255,255,0.1)_inset]">
<div class="flex items-center gap-4">
<button class="hover:scale-105 transition-transform p-2">
<span class="material-symbols-outlined text-primary text-3xl">menu</span>
</button>
<h1 class="font-display-xl text-headline-lg text-primary tracking-tighter">HearSight</h1>
</div>
<button class="hover:scale-105 transition-transform p-2 ring-primary/30 active:ring-4 transition-all rounded-full">
<span class="material-symbols-outlined text-primary text-3xl">emergency_home</span>
</button>
</header>
<main class="flex-grow pt-32 pb-40 px-margin-mobile flex flex-col items-center max-w-2xl mx-auto w-full">
<!-- Hero Section: Organic Mic Orb -->
<section class="w-full flex flex-col items-center mb-stack-gap">
<div class="relative group cursor-pointer">
<!-- Ambient Glow Behind Orb -->
<div class="absolute inset-0 bg-tertiary/20 blur-[80px] rounded-full group-hover:scale-125 transition-transform duration-700"></div>
<!-- Main Mic Orb Component -->
<div class="mic-orb w-[220px] h-[220px] md:w-[280px] md:h-[280px] rounded-[40%] flex items-center justify-center transition-all duration-500 hover:rounded-full shadow-2xl relative z-10">
<span class="material-symbols-outlined text-white text-[80px] md:text-[100px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<!-- Sub-Text Label -->
<div class="mt-8 text-center">
<p class="font-body-xl text-body-xl text-[#3e2e00] opacity-80">Listening for your command...</p>
<p class="font-label-lg text-label-lg text-tertiary-container uppercase tracking-widest mt-2">System Active</p>
</div>
</div>
</section>
<!-- Bento Navigation Section -->
<section class="w-full grid grid-cols-1 gap-6">
<!-- Primary Action: Take me Home -->
<button class="tactile-press w-full min-h-[120px] bg-[#e76f51] text-white rounded-[32px] p-6 flex items-center justify-between shadow-xl transition-all hover:brightness-110">
<div class="flex flex-col items-start text-left">
<span class="font-headline-lg text-headline-lg-mobile">Take me Home</span>
<span class="font-body-md text-body-md opacity-90">12 mins away • Clear Path</span>
</div>
<div class="bg-white/20 p-4 rounded-2xl">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
</button>
<!-- Secondary Action: Navigate to Office -->
<button class="tactile-press w-full min-h-[120px] bg-[#ffd166] text-[#503d00] rounded-[32px] p-6 flex items-center justify-between shadow-lg transition-all hover:brightness-105">
<div class="flex flex-col items-start text-left">
<span class="font-headline-lg text-headline-lg-mobile">Navigate to Office</span>
<span class="font-body-md text-body-md opacity-80">Traffic building • via Park St.</span>
</div>
<div class="bg-[#503d00]/10 p-4 rounded-2xl">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
</button>
<!-- Two-Up Grid for Quick Insights -->
<div class="grid grid-cols-2 gap-6 w-full">
<div class="glass-card min-h-[160px] rounded-[32px] p-6 flex flex-col justify-between border-2 border-primary/10">

<div>
<p class="font-label-lg text-label-lg text-on-surface-variant">Objects Nearby</p>
<h3 class="font-headline-lg text-headline-lg-mobile text-primary">3 People</h3>
</div>
</div>
<div class="glass-card min-h-[160px] rounded-[32px] p-6 flex flex-col justify-between border-2 border-tertiary/10">

<div>

</div>
